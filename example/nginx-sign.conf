# MA-RFW v3.0.0 (MoeArt Replay Firewall)
# MoeArt Inc, MA-SEC Team
#
# nginx 部署示例(签名模式, 配合 rfw.js 前端拦截器)
#
# 两种挂载方式任选其一(不要同时使用, 否则同一请求会被处理两遍):
#   A) 全局插件模式(推荐, 与本机其它插件统一):
#      http 块 lua_package_path 增加一项 replayfirewall/?.lua;
#      init.lua 里 require("ma_rfw"), access.lua 见 init.lua.example / access.lua.example;
#      只处理打了 $rfw_on=1 标记的 location, 未标记的一律跳过。
#      注意: 本站内部 proxy_pass 转发到同一 nginx 的其它站点时, 目标落点不要打标记,
#        否则同一请求会被处理两遍(第二遍 nonce 已被消费 → 误判 sign-replay)。
#   B) 单 location 直挂: 只在该 location 里 access_by_lua_file, 全局 access.lua
#      不调用(该 location 同样要打 set $rfw_on 1;, 插件 run() 内部也会检查标记)。
#
# 前提检查(宝塔 nginx 一般自带, 确认):
#   nginx -V 2>&1 | grep -o 'http_sub_module'      # 没有则装 ngx_http_sub_module
#
# http 块必配:
#   lua_shared_dict rfw 64m;    # 跨 worker 共享内存(插件存储后端)
#   lua_code_cache on;          # 生产必须 on
#
# 前端:
#   rfw.js 放到网站根目录, 供 iframe 页面注入
#
# 部署:
#   1. 覆盖插件文件 ma_rfw.lua / config.lua / sha256.lua / webui.lua / blocked.html
#   2. 在要保护的位置加 set $rfw_on 1;(见下方 server 块)
#   3. 移除所有旧的 location 级 access_by_lua_file 直挂(残留挂载无法打标记, 不生效)
#   4. nginx -s reload
#
# 关于静态资源:
#   模块内置静态/动态分类——静态资源(js/css/图片等)仅做封禁检查, 不参与签名与比例统计。
#   若要免除静态请求的 Lua 开销, 可将 $rfw_on 只打在动态接口的 location(如 location /api/)。
#
# 状态页: GET /cgi-rfw/status → HTML 表格
#   由插件内直接拦截返回, 无需额外 location; config.status_enabled=false 可关闭。

server {
    # ...(你的 listen/server_name/ssl 等)...
    # ...(你的 location 逻辑保持不变, 仅在要保护的位置加一行标记)...

    # ---- 管理面板 ----
    location /cgi-rfw {
        content_by_lua_file replayfirewall/webui.lua;
    }

    # ---- 关键点 1: rfw.js 静态文件(带强制缓存) ----
    location = /rfw.js {
        alias replayfirewall/rfw.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---- 关键点 2: 同源 HTML 响应注入 rfw.js(覆盖 iframe 页面) ----
    # sub_filter 需要 http_sub_module
    sub_filter '</head>' '<script src="/rfw.js"></script></head>';
    sub_filter_once on;          # 每个响应只替换第一次出现
    # 只替换 HTML(默认就是 text/html); 若响应有 gzip, sub_filter 会自动解压再压缩

    # ---- 主 location(原有 location / 逻辑保持, 仅示意) ----
    location / {
        set $rfw_on 1;           # ← 打标记: 这个 location 才处理(方式 A)
        client_max_body_size 10m;
        client_body_buffer_size 128k;   # body 超过则写临时文件, 模块已处理
        # ...(你的 root / proxy_pass)...
    }
    # 方式 B(单 location 直挂)则把上面 set 换成(标记仍需保留):
    #   set $rfw_on 1;
    #   access_by_lua_file replayfirewall/ma_rfw.lua;
}

# 内部 proxy_pass 落点的站点(同一 nginx 上的后端站点):
#   server { ... }   # 不要写 set $rfw_on 1; 该站点请求自动跳过, 不会重复校验
#
# 校验: nginx -t  &&  nginx -s reload
# 验证注入生效: curl -s https://你的域名/ | grep -o 'rfw.js'  应输出 rfw.js
# 注意: 若你的 nginx 是 HTTPS, sub_filter 对 304/图片等非 text/html 响应不处理, 无需担心
